# Example policy-engine config for load_policies().
# Policies run in declaration order. Params are per-policy; omit a mapping
# (or leave it empty) to use defaults.
#
#   from sdk import load_policies, SecureAgent
#   agent = SecureAgent(agent, policies=load_policies("policies.yaml"))

policies:
  prompt_injection:
    threshold: 0.5        # block inputs scoring at or above this [0, 1]
    # tool_output: annotate   # around a tool: off | annotate | deny what it returned
  toxicity:
    threshold: 0.5        # abusive expression: violence, hate, harassment, self-harm
  harmful_request:
    threshold: 0.5        # requests for harmful capability: weapons, malware, doxxing, …
  pii:
    mode: redact          # redact | deny
  secrets:
    mode: redact          # redact | deny — also covers internal URLs
  # Acts on tool calls only. In a SecureAgent's list it sees nothing and does
  # nothing; give the policies to SecureTool to put it in front of a tool.
  tool_firewall:
    rules_path: sdk/policies/tools_example.yaml
  # Also tool calls only. Once a session has run one of `sources`, every call
  # to one of `sinks` waits for a person. Neither list has a default, and the
  # one list of policies has to be shared by all of a session's tools: what a
  # session has read is remembered on the policy instance.
  # session_taint:
  #   sources: [fetch_issue, read_page]   # or "*": every tool's result taints
  #   sinks: [send_email, run_shell]      # or "*": every tool is held
  #   on_taint: require_approval          # require_approval | deny
  # output_schema:
  #   model: myapp.schemas:ReportModel   # dotted path to a pydantic model
  #   on_invalid: deny                   # deny | annotate
  #   hallucination_mode: keyword        # keyword | embedding (pip install openscript[ml])
  #   hallucination_threshold: 0.5
