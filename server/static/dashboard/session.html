<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenScript — Session Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    #graph-container {
      width: 100%;
      height: 480px;
      border-radius: 0.5rem;
      border: 1px solid #e5e7eb;
      background: #fafafa;
    }
    .event-threat      { background: #fff1f2; border-left: 3px solid #f43f5e; }
    .event-interceptor { border-left: 3px solid #8b5cf6; }
    .event-tool        { border-left: 3px solid #f97316; }
    .event-turn        { border-left: 3px solid #3b82f6; }
    .event-default     { border-left: 3px solid #9ca3af; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen" x-data="sessionApp()" x-init="init()" x-cloak>

  <!-- API key modal -->
  <div x-show="showKeyModal"
       class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-2xl p-6 w-96">
      <h2 class="text-lg font-semibold mb-3">Set API Key</h2>
      <p class="text-sm text-gray-500 mb-4">
        Enter your <code class="bg-gray-100 px-1 rounded">OPENSCRIPT_API_KEY</code> to authenticate requests.
      </p>
      <input x-model="inputKey" type="password" placeholder="API key"
             @keydown.enter="saveKey()"
             class="w-full border rounded-lg px-3 py-2 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <div class="flex gap-2 justify-end">
        <button x-show="apiKey" @click="showKeyModal = false"
                class="px-4 py-2 text-sm rounded-lg border hover:bg-gray-50">Cancel</button>
        <button @click="saveKey()"
                class="px-4 py-2 text-sm rounded-lg bg-blue-600 text-white hover:bg-blue-700">Save</button>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-gray-900 text-white px-6 py-4 flex items-center gap-3">
    <a href="/dashboard/" class="text-gray-400 hover:text-white text-sm">← Sessions</a>
    <svg class="w-5 h-5 text-red-400 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
    </svg>
    <span class="text-lg font-semibold tracking-tight">OpenScript</span>
    <button @click="showKeyModal = true; inputKey = apiKey"
            class="ml-auto text-sm px-3 py-1.5 rounded-lg border border-gray-600 hover:border-gray-400 text-gray-300 hover:text-white">
      🔑 API Key
    </button>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">

    <!-- Error banner -->
    <div x-show="error"
         class="mb-4 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm"
         x-text="error"></div>

    <!-- Session ID + stats strip -->
    <div class="flex items-start justify-between mb-6">
      <div>
        <h1 class="text-xl font-bold font-mono" x-text="sessionId || 'Loading…'"></h1>
        <p class="text-sm text-gray-500 mt-0.5">Session detail — event timeline &amp; causal graph</p>
      </div>
      <div class="flex gap-3 text-sm">
        <div class="bg-white border rounded-lg px-4 py-2 text-center">
          <div class="font-bold text-lg" x-text="stats.event_count || 0"></div>
          <div class="text-gray-500 text-xs">Events</div>
        </div>
        <div class="bg-white border rounded-lg px-4 py-2 text-center"
             :class="stats.threat_count > 0 ? 'border-red-300 bg-red-50' : ''">
          <div class="font-bold text-lg" :class="stats.threat_count > 0 ? 'text-red-600' : ''"
               x-text="stats.threat_count || 0"></div>
          <div class="text-gray-500 text-xs">Threats</div>
        </div>
        <div class="bg-white border rounded-lg px-4 py-2 text-center">
          <div class="font-bold text-lg"
               :class="(stats.max_threat_score || 0) >= 0.7 ? 'text-red-600' : 'text-green-600'"
               x-text="stats.max_threat_score ? stats.max_threat_score.toFixed(2) : '0.00'"></div>
          <div class="text-gray-500 text-xs">Max Score</div>
        </div>
        <div class="bg-white border rounded-lg px-4 py-2 text-center">
          <span x-show="stats.flagged"
                class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700">
            🚨 Flagged
          </span>
          <span x-show="!stats.flagged"
                class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700">
            ✓ Clean
          </span>
          <div class="text-gray-500 text-xs mt-0.5">Status</div>
        </div>
      </div>
    </div>

    <!-- Two-column layout -->
    <div class="grid grid-cols-2 gap-6">

      <!-- Left: Graph -->
      <div class="bg-white rounded-xl border p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold text-sm">Causal Session Graph</h2>
          <div class="flex gap-3 text-xs text-gray-500">
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>Turn</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>Threat</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-purple-500 inline-block"></span>Interceptor</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-orange-400 inline-block"></span>Tool</span>
          </div>
        </div>
        <div id="graph-container"></div>
        <p x-show="graphLoading" class="text-xs text-gray-400 text-center mt-2">Building graph…</p>
      </div>

      <!-- Right: Event timeline -->
      <div class="bg-white rounded-xl border">
        <div class="flex items-center justify-between px-4 py-3 border-b">
          <h2 class="font-semibold text-sm">Event Timeline</h2>
          <span class="flex items-center gap-1 text-xs text-blue-600">
            <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse inline-block"></span>
            Polling
          </span>
        </div>
        <div class="divide-y overflow-y-auto" style="max-height: 440px;">
          <template x-for="ev in events" :key="ev.id">
            <div class="px-4 py-2.5 text-xs" :class="eventClass(ev)">
              <div class="flex items-center justify-between mb-1">
                <span class="font-medium font-mono" x-text="ev.event_type"></span>
                <span class="text-gray-400" x-text="formatTime(ev.timestamp)"></span>
              </div>
              <div class="text-gray-600 font-mono truncate" x-text="payloadSummary(ev)"></div>
              <div x-show="ev.event_type === 'threat_detected'" class="mt-1">
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-red-100 text-red-700 font-medium">
                  score: <span x-text="ev.payload?.score?.toFixed ? ev.payload.score.toFixed(3) : ev.payload?.score"></span>
                </span>
                <span class="ml-1 text-gray-500"
                      x-text="Object.keys(ev.payload?.signals || {}).join(', ')"></span>
              </div>
            </div>
          </template>
          <div x-show="events.length === 0 && !loading"
               class="px-4 py-8 text-center text-gray-400 text-sm">No events yet</div>
        </div>
      </div>

    </div>
  </main>

  <script>
    const NODE_COLORS = {
      turn:         { background: '#3b82f6', border: '#1d4ed8' },
      threat:       { background: '#ef4444', border: '#b91c1c' },
      interceptor:  { background: '#8b5cf6', border: '#6d28d9' },
      tool_call:    { background: '#f97316', border: '#c2410c' },
      memory_write: { background: '#10b981', border: '#047857' },
      policy:       { background: '#f59e0b', border: '#b45309' },
      agent_message:{ background: '#6b7280', border: '#374151' },
    };

    function sessionApp() {
      return {
        sessionId: new URLSearchParams(location.search).get('session_id') || '',
        events: [],
        stats: {},
        loading: true,
        graphLoading: true,
        error: '',
        showKeyModal: false,
        inputKey: '',
        _network: null,

        get apiKey() {
          return localStorage.getItem('openscript_api_key') || '';
        },

        saveKey() {
          const key = this.inputKey.trim();
          if (!key) return;
          localStorage.setItem('openscript_api_key', key);
          this.showKeyModal = false;
          this.error = '';
          this.init();
        },

        async init() {
          if (!this.sessionId) return;
          if (!this.apiKey) { this.showKeyModal = true; return; }
          await Promise.all([this.fetchEvents(), this.fetchStats()]);
          await this.fetchGraph();
          this.startPolling();
        },

        async fetchEvents() {
          this.loading = true;
          try {
            const res = await fetch(`/events/${encodeURIComponent(this.sessionId)}`, {
              headers: { 'X-API-KEY': this.apiKey },
            });
            if (res.status === 401) { this.showKeyModal = true; return; }
            if (!res.ok) { this.error = `Events endpoint returned ${res.status} — check server logs`; return; }
            const data = await res.json();
            this.events = data.events || [];
            if (this.events.length === 0) {
              this.error = 'No events found for this session. Was DATABASE_URL set when the demo ran?';
            }
          } catch (e) {
            this.error = `Cannot reach server: ${e.message}`;
          } finally {
            this.loading = false;
          }
        },

        async fetchStats() {
          try {
            const res = await fetch(`/sessions/${encodeURIComponent(this.sessionId)}/stats`, {
              headers: { 'X-API-KEY': this.apiKey },
            });
            if (res.ok) this.stats = await res.json();
          } catch {}
        },

        async fetchGraph() {
          this.graphLoading = true;
          try {
            const res = await fetch(`/sessions/${encodeURIComponent(this.sessionId)}/graph`, {
              headers: { 'X-API-KEY': this.apiKey },
            });
            if (!res.ok) { this.error = `Graph endpoint returned ${res.status} — check server logs`; return; }
            const data = await res.json();
            if (data.node_count === 0) return;
            this.$nextTick(() => this.renderGraph(data));
          } finally {
            this.graphLoading = false;
          }
        },

        startPolling() {
          const poll = async () => {
            const maxSeq = this.events.length > 0
              ? Math.max(...this.events.map(e => e.sequence_num))
              : 0;
            try {
              const res = await fetch(
                `/events/${encodeURIComponent(this.sessionId)}?after_sequence=${maxSeq}`,
                { headers: { 'X-API-KEY': this.apiKey } },
              );
              if (res.ok) {
                const data = await res.json();
                const newEvents = data.events || [];
                if (newEvents.length > 0) {
                  this.events.push(...newEvents);
                  await this.fetchStats();
                }
              }
            } catch {}
            setTimeout(poll, 2000);
          };
          setTimeout(poll, 2000);
        },

        renderGraph(data) {
          const container = document.getElementById('graph-container');
          if (!container) return;

          const nodes = data.nodes.map(n => {
            const c = NODE_COLORS[n.node_type] || NODE_COLORS.agent_message;
            return {
              id: n.id,
              label: `#${n.sequence_num}\n${n.node_type}`,
              color: { background: c.background, border: c.border,
                       highlight: { background: c.background, border: '#1f2937' } },
              font: { color: '#fff', size: 10 },
              shape: n.node_type === 'threat' ? 'diamond' : 'dot',
              size:  n.node_type === 'threat' ? 18 : 12,
            };
          });

          const edges = data.edges.map((e, i) => ({
            id: i,
            from: e.source,
            to: e.target,
            arrows: { to: { enabled: true, scaleFactor: 0.5 } },
            color: { color: e.type === 'parent' ? '#f97316' : '#9ca3af' },
            dashes: e.type === 'parent',
            width:  e.type === 'parent' ? 1.5 : 1,
          }));

          this._network = new vis.Network(
            container,
            { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) },
            {
              layout: { hierarchical: { direction: 'LR', sortMethod: 'directed', levelSeparation: 120 } },
              physics: false,
              interaction: { hover: true, tooltipDelay: 100 },
              edges: { smooth: { type: 'cubicBezier', forceDirection: 'horizontal' } },
            },
          );
        },

        eventClass(ev) {
          const t = ev.event_type || '';
          if (t === 'threat_detected')   return 'event-threat';
          if (t.startsWith('interceptor')) return 'event-interceptor';
          if (t.startsWith('tool'))      return 'event-tool';
          if (t.startsWith('turn'))      return 'event-turn';
          return 'event-default';
        },

        payloadSummary(ev) {
          const p = ev.payload || {};
          if (ev.event_type === 'threat_detected')
            return `score=${p.score} | reason=${p.reason || ''}`;
          if (ev.event_type === 'interceptor_before')
            return `action=${p.action} | input="${(p.input_data || {}).input || JSON.stringify(p.input_data).slice(0, 80)}"`;
          if (ev.event_type === 'interceptor_after')
            return `action=${p.action} | output=${JSON.stringify(p.output_data || {}).slice(0, 80)}`;
          return JSON.stringify(p).slice(0, 100);
        },

        formatTime(iso) {
          if (!iso) return '';
          return new Date(iso).toLocaleTimeString(undefined, {
            hour: '2-digit', minute: '2-digit', second: '2-digit',
          });
        },
      };
    }
  </script>
</body>
</html>
