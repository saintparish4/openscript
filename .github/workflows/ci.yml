name: CI

on:
  push:
    branches: [master]
  pull_request: 
    branches: [master] 

jobs:
  lint:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5 
        with: 
          python-version: "3.12" 

      - name: Install dependencies 
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements.txt 

      - name: Ruff lint 
        run: ruff check . 

      - name: Black format check 
        run: black --check .  

  type-check:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5 
        with: 
          python-version: "3.12" 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 
          pip install -e . 

      - name: MyPy 
        run: mypy --strict sdk/ contracts/ 

  test:
    runs-on: ubuntu-latest
    strategy: 
      matrix: 
        python-version: ['3.10', '3.11', '3.12', '3.13'] 
    steps: 
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5 
        with: 
          python-version: ${{ matrix.python-version }} 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 
          pip install -e . 

      - name: Run tests 
        run: pytest -v 

  build:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test] 
    steps: 
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5 
        with: 
          python-version: "3.12" 

      - name: Install build tools 
        run: python -m pip install --upgrade pip build 

      - name: Build package
        run: python -m build 

      - name: Verify wheel
        run: |
          pip install dist/*.whl
          python -c "from contracts import Interceptor, FailureMode, AgentCapabilities; print('contracts OK')"
          python -c "from sdk import OpenScriptMiddleware, NoopInterceptor; print('sdk OK')"