name: CI

on:
  push:
    branches: [master]
  pull_request: 
    branches: [master] 

jobs:
  lint:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5 
        with: 
          python-version: "3.12" 

      - name: Install dependencies 
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements.txt 

      - name: Black format check
        run: black --check .

  type-check:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5 
        with: 
          python-version: "3.12" 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 
          pip install -e . 

      - name: MyPy 
        run: mypy --strict sdk/ contracts/ 

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 
          pip install -e . 

      - name: Run tests 
        run: pytest -v 

  pyodide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build packaging

      - name: Phase 0 — policy audit verdict still holds
        run: python tools/policy_audit.py

      - name: Phase 0 — audit gate
        run: pytest tests/test_audit.py -v

      - name: Phase 1 — wheel + dependency-floor gates
        run: pytest tests/test_pyodide_compat.py -v

      - run: npm ci

      - name: Build the browser wheel bundle
        run: bash tools/build_browser_wheels.sh
        env:
          PYTHON: python

      - name: Phase 1 gate — every policy under WASM
        run: node web/probe.mjs

  build:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test] 
    steps: 
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5 
        with: 
          python-version: "3.12" 

      - name: Install build tools 
        run: python -m pip install --upgrade pip build 

      - name: Build package
        run: python -m build 

      - name: Verify wheel
        run: |
          pip install dist/*.whl
          python -c "from contracts import Interceptor, FailureMode, AgentCapabilities; print('contracts OK')"
          python -c "from sdk import OpenScriptMiddleware, NoopInterceptor; print('sdk OK')"