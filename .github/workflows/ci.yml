name: CI

# Documentation-only changes skip the whole pipeline: nothing in these jobs
# reads a markdown file, so running them proves nothing and costs six runners.
# The two lists are duplicated on purpose — GitHub Actions does not expand YAML
# anchors — so keep them identical, or a PR can pass checks that its merge skips.
on:
  push:
    branches: [master]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5 
        with: 
          python-version: "3.12" 

      - name: Install dependencies 
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements.txt 

      - name: Black format check
        run: black --check .

  type-check:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5 
        with: 
          python-version: "3.12" 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 
          pip install -e . 

      - name: MyPy 
        run: mypy --strict sdk/ contracts/ 

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 
          pip install -e . 

      - name: Run tests 
        run: pytest -v 

  pyodide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build packaging

      - name: Confirm the policy audit verdict still holds
        run: python tools/policy_audit.py

      - name: Audit gate
        run: pytest tests/test_audit.py -v

      - name: Wheel and dependency-floor gates
        run: pytest tests/test_pyodide_compat.py -v

      - run: npm ci

      - name: Build the browser wheel bundle
        run: bash tools/build_browser_wheels.sh
        env:
          PYTHON: python

      - name: Run every policy under WASM
        run: node web/probe.mjs

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build

      # Rebuilt from the current source rather than trusting the committed
      # site/public/wheels/ — the two are held together by
      # test_committed_browser_wheel_matches_source in the `test` job.
      - name: Build the browser wheel bundle
        run: bash tools/build_browser_wheels.sh
        env:
          PYTHON: python

      - name: Install the demo app
        run: npm ci
        working-directory: site

      - name: Type-check the demo app
        run: npm run typecheck
        working-directory: site

      - name: Export the demo app
        run: npm run build
        working-directory: site

      - name: Check every gallery example behaves as advertised
        run: npm run verify
        working-directory: site

  build:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test] 
    steps: 
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5 
        with: 
          python-version: "3.12" 

      - name: Install build tools 
        run: python -m pip install --upgrade pip build 

      - name: Build package
        run: python -m build 

      - name: Verify wheel
        run: |
          pip install dist/*.whl
          python -c "from contracts import Interceptor, FailureMode, AgentCapabilities; print('contracts OK')"
          python -c "from sdk import OpenScriptMiddleware, NoopInterceptor; print('sdk OK')"