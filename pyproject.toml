[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "openscript"
version = "0.1.0" 
description = "Python SDK for building prompt-secured LLM/agent workflows"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.12",
    "structlog>=25.5.0", 
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.2",
]
redis = [
    "redis>=7.3.0",
]
metrics = [
    "prometheus-client>=0.24.1",
]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=5.2.3",
    "black>=26.1.0",
    "ruff>=0.15.6",
    "mypy>=1.19.1",
    "types-PyYAML>=6.0",
    "hypothesis>=6.151.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sdk", "contracts*", "events*", "server*"]  

[tool.pytest.ini_options]
# Repo root must be on path so `sdk` and `contracts` resolve when collecting tests.
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.ruff] 
target-version = "py312" 
line-length = 100 

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length (black handles this)
    "UP042",  # StrEnum requires Python 3.11+; project supports 3.10
]

[tool.ruff.lint.isort]
known-first-party = ["sdk", "contracts"]

# FastAPI dependency injection uses Depends(...) in parameter defaults by design.
# load_dotenv() must run before downstream imports that read env vars at import time.
[tool.ruff.lint.per-file-ignores]
"server/app.py" = ["B008", "E402"]
"server/routers/sessions.py" = ["B008"]
"server/routers/sse.py" = ["B008"]
"demo/injection_demo.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true 
disallow_untyped_defs = true 
disallow_incomplete_defs = true 
check_untyped_defs = true  

[[tool.mypy.overrides]]
module = ["structlog.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentence_transformers"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sdk.middleware.middleware", "sdk.integrations.*"]
disallow_any_explicit = false
warn_return_any = false