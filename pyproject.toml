[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is openscript-sdk because "openscript" on PyPI is an
# unrelated project. The import name matches it: `import openscript_sdk`.
name = "openscript-sdk"
version = "0.1.0"
description = "Hold an AI agent's irreversible tool calls until a person approves that exact call"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sharif Parish" }]
keywords = [
    "ai-agents", "agent-security", "prompt-injection", "human-in-the-loop",
    "tool-calling", "llm", "guardrails", "claude-code",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # Floor held at 2.10 so the browser build works: Pyodide 0.28.3 bundles
    # pydantic 2.10.6, and no pydantic-core between 2.28 and 2.46 publishes a
    # WASM wheel. Raising this floor breaks the browser build.
    "pydantic>=2.10,<3",
    "structlog>=25.5.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/saintparish4/openscript"
Documentation = "https://github.com/saintparish4/openscript/blob/master/docs/guide.md"
Source = "https://github.com/saintparish4/openscript"
Issues = "https://github.com/saintparish4/openscript/issues"
Demo = "https://openscript-demo.vercel.app/"

[project.scripts]
# The Claude Code hook: openscript_sdk/hooks/claude_code.py, configured by a YAML file
# (openscript_sdk/hooks/claude_code_example.yaml) and wired in by settings_example.json.
openscript-hook = "openscript_sdk.hooks.claude_code:main"

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.2",
]
redis = [
    "redis>=7.3.0",
]
metrics = [
    "prometheus-client>=0.24.1",
]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]
# The FastAPI server (openscript_sdk.server.app): the event store, SSE, the
# dashboard, the approval queue, /v1/guard for the Java client, /metrics.
# Its database migrations live in the repository's alembic/, not the wheel.
server = [
    "openscript-sdk[metrics,redis]",
    "fastapi>=0.128.0",
    "uvicorn>=0.42.0",
    "sqlalchemy[asyncio]>=2.0.48",
    "asyncpg>=0.31.0",
    "python-dotenv>=1.0.0",
]
# Everything demo/injection_demo.py imports unconditionally. It also prints
# Prometheus metrics, hence the self-reference onto [metrics] rather than
# duplicating prometheus-client's pin here.
demo = [
    "openscript-sdk[metrics]",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=5.2.3",
    "black>=26.1.0",
    "ruff>=0.15.6",
    "mypy>=1.19.1",
    "types-PyYAML>=6.0",
    "hypothesis>=6.151.9",
    "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["."]
# "openscript_sdk" without the wildcard matches ONLY openscript_sdk/__init__.py and
# logging.py: every policy subpackage is an implicit namespace package underneath it.
include = ["openscript_sdk*"]

# Not Python, but read at runtime or copied by users: the server's dashboard
# (served at /dashboard/; without these files the server starts and silently
# serves none), the example configs the guide tells people to copy, and the
# PEP 561 marker that the Typing :: Typed classifier promises.
[tool.setuptools.package-data]
openscript_sdk = [
    "py.typed",
    "hooks/*.yaml",
    "hooks/*.json",
    "policies/*.yaml",
    "server/*.yaml",
    "server/static/dashboard/*.html",
]

[tool.pytest.ini_options]
# Repo root must be on path so `openscript_sdk` and `evals` resolve when collecting tests.
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
target-version = ["py311"]
line-length = 100
# web/smoke.py runs under Pyodide's runPythonAsync, where top-level `await` is
# legal. It is not importable Python, so neither formatter can parse it.
force-exclude = "web/"

# Match requires-python (>=3.11), so pyupgrade only suggests what the floor has.
[tool.ruff] 
target-version = "py311"
line-length = 100 
# See the note on [tool.black].force-exclude — top-level await outside a
# function is a syntax error to every static tool, and correct here.
extend-exclude = ["web"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length (black handles this)
]

[tool.ruff.lint.isort]
known-first-party = ["openscript_sdk"]

# FastAPI dependency injection uses Depends(...) in parameter defaults by design.
# load_dotenv() must run before downstream imports that read env vars at import time.
[tool.ruff.lint.per-file-ignores]
"openscript_sdk/server/app.py" = ["B008", "E402"]
"openscript_sdk/server/routers/approvals.py" = ["B008"]
"openscript_sdk/server/routers/sessions.py" = ["B008"]
"openscript_sdk/server/routers/sse.py" = ["B008"]
"demo/injection_demo.py" = ["E402"]
# Logging is silenced before the policies are imported so their per-finding
# warnings stay out of the browser console; the UI is the report.
"site/public/pipeline.py" = ["E402"]
"extension/agent.py" = ["E402"]
# The confusables table is a list of characters that look like ASCII but are
# not. Flagging them as ambiguous is the whole point of the file, and of the
# obfuscated prompts the tests and the eval corpora are built from.
"openscript_sdk/policies/normalize.py" = ["RUF001", "RUF002"]
"tests/test_normalize.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true 
disallow_untyped_defs = true 
disallow_incomplete_defs = true 
check_untyped_defs = true  

[[tool.mypy.overrides]]
module = ["structlog.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentence_transformers"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openscript_sdk.middleware.middleware", "openscript_sdk.integrations.*"]
disallow_any_explicit = false
warn_return_any = false